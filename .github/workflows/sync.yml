name: Sync Pinterest board

on:
  schedule:
    - cron: "0 */6 * * *"       # toutes les 6 heures
  workflow_dispatch: {}         # bouton « Run workflow » manuel

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-pins
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Récupérer les épingles → slides.json
        env:
          # Aucun secret : sync.mjs interroge les endpoints publics internes de Pinterest.
          BOARD_NAME: diaporama
          BOARD_USER: Pseba37
        run: node sync.mjs

      - name: Commit si slides.json a changé
        run: |
          if [ -n "$(git status --porcelain slides.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add slides.json
            git commit -m "Sync des épingles Pinterest"
            # Récupère d'éventuels commits poussés entre le checkout et maintenant,
            # sinon le push échoue (non-fast-forward) jusqu'au run suivant.
            git push || { git pull --rebase --autostash && git push; }
            echo "slides.json mis à jour."
          else
            echo "Aucun changement."
          fi

      # Si une étape précédente a échoué (endpoints Pinterest changés, anti-bot, réseau…),
      # on ouvre une issue d'alerte — ou on commente l'issue d'alerte déjà ouverte, pour
      # ne pas en créer une nouvelle à chaque run planifié (toutes les 6 h).
      - name: Alerte en cas d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="⚠️ Échec de la synchro Pinterest (sync.mjs)"
          BODY="La synchronisation a échoué. Les endpoints internes de Pinterest ont peut-être changé (format JSON, protection anti-bot) ou il s'agit d'un incident réseau ponctuel.

          Détails du run : $RUN_URL

          Le site continue d'afficher le dernier \`slides.json\` valide en attendant."
          EXISTING="$(gh issue list --state open --label sync-failure --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create sync-failure --color B60205 --description "Échec de la synchro Pinterest" 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label sync-failure
          fi
